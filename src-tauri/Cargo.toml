[package]
name = "burst-wallet-gui"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
name = "burst_wallet_gui_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
hex = "0.4"
burst-wallet-core = { path = "../../protocol/wallet_core" }
burst-groups = { path = "../../protocol/groups" }
burst-types = { path = "../../protocol/types" }
burst-ledger = { path = "../../protocol/ledger" }
burst-transactions = { path = "../../protocol/transactions" }
burst-governance = { path = "../../protocol/governance" }
burst-crypto = { path = "../../protocol/crypto" }
bincode = "1"

[dev-dependencies]
tempfile = "3"
